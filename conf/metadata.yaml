# Beryl Metadata baseline.

# -------------------- Cluster identity --------------------
beryl.cluster.id: "local-beryl"

# -------------------- Network endpoints --------------------
beryl.metadata.host: "127.0.0.1"
beryl.metadata.bind-host: "0.0.0.0"
beryl.metadata.rpc.port: 18080
beryl.metadata.http.port: 18081

# -------------------- Storage --------------------
beryl.metadata.storage.dir: "data/metadata"

# -------------------- Namespace listing --------------------
beryl.metadata.namespace.list.default-page-size: 1000
beryl.metadata.namespace.list.max-page-size: 10000

# -------------------- Namespace deletion --------------------
beryl.metadata.namespace.delete.interval: 1s
beryl.metadata.namespace.delete.batch.max-roots: 64
beryl.metadata.namespace.delete.batch.max-entries: 256
beryl.metadata.namespace.delete.batch.max-size: 1MiB
beryl.metadata.namespace.delete.retry.initial-backoff: 1s
beryl.metadata.namespace.delete.retry.max-backoff: 1min

# -------------------- Block cleanup --------------------
beryl.metadata.block.cleanup.enabled: true
beryl.metadata.block.cleanup.interval: 30s
beryl.metadata.block.cleanup.grace-period: 5min
beryl.metadata.block.cleanup.scan-limit: 10000
beryl.metadata.block.cleanup.queue-capacity: 10000
beryl.metadata.block.cleanup.batch-size: 32
beryl.metadata.block.cleanup.retry.initial-backoff: 1s
beryl.metadata.block.cleanup.retry.max-backoff: 1min

# -------------------- Startup --------------------
beryl.metadata.startup.retry.initial-backoff: 200ms
beryl.metadata.startup.retry.max-backoff: 5s
beryl.metadata.startup.warn-after: 1min
beryl.metadata.startup.timeout: 2min
beryl.metadata.startup.fail-fast: false

# -------------------- Shutdown --------------------
beryl.metadata.shutdown.timeout: 30s

# -------------------- Write leases --------------------
beryl.metadata.write-lease.timeout: 1min

# -------------------- Worker liveness --------------------
beryl.metadata.worker.liveness.timeout: 1min
beryl.metadata.worker.liveness.scan-interval: 30s

# -------------------- Logging --------------------
beryl.logging.format: compact
beryl.logging.output: stderr
beryl.logging.level: "info,beryl_metadata=info,beryl_worker=info,beryl_common=info,openraft=warn,tonic=warn,tower=warn,h2=warn"

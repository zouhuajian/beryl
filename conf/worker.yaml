# Beryl Worker baseline.

# -------------------- Cluster identity --------------------
beryl.cluster.id: "local-beryl"

# -------------------- Worker identity --------------------
beryl.worker.identity-file: "data/worker/worker.identity"

# -------------------- Network endpoints --------------------
beryl.worker.host: "127.0.0.1"
beryl.worker.bind-host: "0.0.0.0"
beryl.worker.rpc.port: 19090
beryl.worker.rpc.max-concurrent-requests: 100
beryl.worker.http.port: 19091

# -------------------- Metadata RPC --------------------
beryl.worker.metadata.addresses:
  - "127.0.0.1:18080"
beryl.worker.metadata.request-timeout: 5s
beryl.worker.metadata.retry.initial-backoff: 200ms
beryl.worker.metadata.retry.max-backoff: 5s

# -------------------- Heartbeat --------------------
beryl.worker.heartbeat.interval: 1s

# -------------------- Block reports --------------------
beryl.worker.block.report.interval: 1s
beryl.worker.block.report.batch-size: 1000

# -------------------- Block cleanup --------------------
beryl.worker.block.cleanup.queue-capacity: 1024
beryl.worker.block.cleanup.concurrency: 4
beryl.worker.block.cleanup.retry.initial-backoff: 100ms
beryl.worker.block.cleanup.retry.max-backoff: 30s

# -------------------- Read response framing --------------------
beryl.worker.stream.frame-size: 1MiB
beryl.worker.stream.max-frame-size: 4MiB

# -------------------- Storage --------------------
beryl.worker.storage.dirs:
  hdd0:
    path: "data/worker/hdd0"
    tier: hdd
    capacity: 10GiB
beryl.worker.storage.reserved-space: 1GiB
beryl.worker.storage.check-interval: 30s

# -------------------- Shutdown --------------------
beryl.worker.shutdown.timeout: 30s

# -------------------- Logging --------------------
beryl.logging.format: compact
beryl.logging.output: stderr
beryl.logging.level: "info,beryl_metadata=info,beryl_worker=info,beryl_common=info,openraft=warn,tonic=warn,tower=warn,h2=warn"

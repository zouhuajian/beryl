# Beryl native client baseline.

# -------------------- Client identity --------------------
beryl.client.name: "default-client"

# -------------------- Metadata RPC --------------------
beryl.client.metadata.addresses:
  - "127.0.0.1:18080"
beryl.client.metadata.connections.enabled: true
beryl.client.metadata.connections.max: 1

# -------------------- Worker RPC --------------------
beryl.client.worker.connections.enabled: true
beryl.client.worker.connections.max-per-worker: 1
beryl.client.worker.connections.failure-cooldown: 1s

# -------------------- Requests --------------------
beryl.client.request.timeout: 30s
beryl.client.request.max-attempts: 3

# -------------------- Read buffers --------------------
beryl.client.read.max-request-bytes: 8MiB
beryl.client.read.max-buffered-bytes: 64MiB

# -------------------- Write leases --------------------
beryl.client.write-lease.auto-renew: true
beryl.client.write-lease.renew-before-expiry: 30s

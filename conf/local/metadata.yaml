# Local metadata debug profile. Run with:
# beryl-metadata format --config conf/local/metadata.yaml
# beryl-metadata start --config conf/local/metadata.yaml

cluster.id: "local-beryl"

metadata.group.name: "root"
metadata.storage.dir: "./data/metadata"
metadata.rpc.addr: "127.0.0.1"
metadata.rpc.port: 18080
metadata.raft.mode: "single"
metadata.raft.node_id: 1
metadata.list_status.default_page_size: 1000
metadata.list_status.max_page_size: 10000
metadata.bootstrap.ready.timeout_ms: 10000
metadata.bootstrap.ready.warn_after_ms: 1000
metadata.bootstrap.ready.fail_fast: true

# Worker cleanup execution is enabled; set false only as an operational kill switch.
metadata.cleanup.dispatch_enabled: true
metadata.cleanup.max_commands_per_heartbeat: 32
metadata.cleanup.retry_initial_backoff_ms: 1000
metadata.cleanup.retry_max_backoff_ms: 60000

metadata.detached_root_reclamation.scan_interval_ms: 1000
metadata.detached_root_reclamation.max_candidates: 64
metadata.detached_root_reclamation.max_entries: 256
metadata.detached_root_reclamation.max_batch_bytes: 1048576
metadata.detached_root_reclamation.retry_initial_backoff_ms: 1000
metadata.detached_root_reclamation.retry_max_backoff_ms: 60000

metadata.repair.max_queue_size: 10000
metadata.repair.max_attempts: 3
metadata.repair.inflight_timeout_ms: 300000
metadata.repair.initial_backoff_ms: 1000
metadata.repair.max_backoff_ms: 60000
metadata.repair.worker_inflight_limit: 4

observe.log.format: compact
observe.log.output: stderr
observe.log.level: "info,beryl_metadata=info,beryl_worker=info,beryl_common=info,openraft=warn,tonic=warn,tower=warn,h2=warn"
observe.metrics.prometheus.bind: "127.0.0.1:18081"
observe.metrics.prometheus.path: "/metrics"

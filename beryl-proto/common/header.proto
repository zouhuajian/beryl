syntax = "proto3";

package common;

import "common/common.proto";
import "common/errors.proto";

// ============================================================================
// Shared Observability Context
// ============================================================================

/// W3C trace propagation context.
message TraceContextProto {
  /// W3C Trace Context: traceparent header value.
  optional string traceparent = 1;
}

// ============================================================================
// Client Information
// ============================================================================

/// Client information for correlation and routing.
message ClientInfoProto {
  /// Unique identifier for this call (UUID string).
  /// Aligns with types::CallId.
  string call_id = 1;

  /// Internal client runtime identity.
  ClientIdProto client_id = 2;

  /// Low-cardinality client display name for diagnostics.
  string client_name = 3;
}

// ============================================================================
// Protocol Headers (RequestHeaderProto / ResponseHeaderProto)
// ============================================================================

/// Request header carried with every RPC request (metadata-plane and optionally data-plane).
///
/// NOTE:
/// - Keep this message small and stable. Do not use it as a "catch-all".
message RequestHeaderProto {
  /// Client information (call_id, client_id, client_name).
  ClientInfoProto client = 1;

  /// W3C trace propagation context.
  TraceContextProto trace_context = 2;

  /// Stable metadata group name for metadata-plane routing.
  string group_name = 3;

  /// Client-required metadata state-machine applied watermark for one group.
  /// A follower may serve a gated read only after its local applied state for
  /// that group has reached state_id. Absent means no freshness requirement.
  optional GroupStateWatermarkProto state = 4;

  /// Absolute deadline (Unix epoch milliseconds).
  /// For gRPC, grpc-timeout should be authoritative; this is the cross-transport shared wire form.
  int64 deadline_ms = 5;

  /// Optional caller context for auditing/diagnostics.
  /// This is NOT a generic extension point for protocol-critical fields.
  CallerContextProto caller_context = 6;

}

/// Human-oriented context for auditing and lightweight diagnostics.
/// Keep bounded in size and stable in meaning.
message CallerContextProto {
  /// Example: "type=spark,job=42"
  string context = 1;

}

/// Raft log position used as a monotonic "state watermark".
/// Represents the state machine's applied position (last_applied_log_id).
/// Aligns with openraft::LogId<u64> where leader_id = (term, node_id) and index is log index.
message RaftLogIdProto {
  /// Leader term that created the entry (part of leader_id).
  uint64 term = 1;

  /// Node ID of the leader that created the entry (part of leader_id).
  /// This is NOT necessarily the current leader.
  uint64 leader_node_id = 2;

  /// Log index.
  uint64 index = 3;
}

/// Metadata state-machine applied watermark for one owner group.
///
/// group_name identifies the metadata Raft owner group. state_id is that group's
/// state-machine applied RaftLogId. It is not a committed index, append index,
/// private apply counter, or call_id.
message GroupStateWatermarkProto {
  /// State-machine applied RaftLogId for this group.
  RaftLogIdProto state_id = 1;

  /// Stable metadata group name this watermark belongs to.
  string group_name = 2;
}

/// Response header carried with every RPC response.
///
/// IMPORTANT gRPC note:
/// If gRPC returns a non-OK status, many clients will not receive the response message body.
/// Therefore, for recoverable business/protocol errors, prefer:
/// - gRPC status = OK
/// - ResponseHeaderProto.error (ErrorDetailProto) with RPC kind and recovery action
/// Use non-OK gRPC status only for unrecoverable transport/auth/framework errors, and include
/// minimal correlation info (e.g., x-call-id, x-error-code) in trailers metadata.
message ResponseHeaderProto {
  /// Client information (call_id, client_id, client_name).
  ClientInfoProto client = 1;

  /// RPC error detail (single source of truth for all error semantics).
  /// Unset means success. When set, this field contains the RPC failure
  /// fact, recovery action, message, and diagnostic detail.
  optional ErrorDetailProto error = 2;

  /// Server-authorized client state cache update.
  /// Leaders and msync may return one applied watermark. Follower
  /// successful responses must leave this field absent. Absent means "do not
  /// update client state cache"; stale-state is expressed only through the
  /// RPC stale-state error.
  optional GroupStateWatermarkProto state = 3;

  /// Stable metadata group name that processed this request.
  string group_name = 4;
}

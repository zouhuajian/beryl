syntax = "proto3";

package common;

// ============================================================================
// Identity Types (aligned with types::ids)
// ============================================================================

/// Data-plane block identity.
/// Aligns with types::BlockId { inode_id: InodeId, index: BlockIndex }.
message BlockIdProto {
  uint64 inode_id = 1;
  uint32 block_index = 2;
}

/// Internal client runtime identity.
/// Aligns with types::ClientId (u128).
message ClientIdProto {
  // u128 encoded as two uint64 (high, low)
  uint64 high = 1;
  uint64 low = 2;
}

// ============================================================================
// Common Data Structures
// ============================================================================

/// Metadata-selected logical layout persisted with one file inode.
message FileLayoutProto {
  uint32 block_size = 1;
  // Metadata-selected Beryl block data/meta interpretation format for new
  // blocks of this file. Worker format parameters are derived from it.
  uint32 block_format_id = 2;
}

/// Worker endpoint information for client access.
message WorkerEndpointInfoProto {
  uint64 worker_id = 1;
  string endpoint = 2;  // host:port
  // Metadata-confirmed worker process-run identity for this endpoint.
  string worker_run_id = 3;
}

/// Byte range within a file.
/// Aligns with types::chunk::ByteRange { offset: u64, len: u32 }.
message ByteRangeProto {
  uint64 offset = 1;
  uint32 len = 2;
}

/// Fencing token for write operations.
/// Aligns with types::lease::FencingToken { block_id: BlockId, owner: ClientId, epoch: LeaseEpoch }.
message FencingTokenProto {
  BlockIdProto block_id = 1;
  ClientIdProto owner = 2;
  uint64 epoch = 3;
}

// ============================================================================
// Endpoint / Node Information
// ============================================================================

/// Worker network endpoint information.
message EndpointProto {
  string host = 1;
  uint32 port = 2;
}

/// Worker-local storage tier for a block replica or store directory.
enum TierProto {
  TIER_UNSPECIFIED = 0;
  TIER_MEM = 1;
  TIER_NVME = 2;
  TIER_SSD = 3;
  TIER_HDD = 4;
}

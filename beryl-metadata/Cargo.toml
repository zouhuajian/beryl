[package]
name = "beryl-metadata"
version.workspace = true
edition = "2021"

[dependencies]
# Workspace dependencies
beryl-common = { path = "../beryl-common" }
beryl-types = { path = "../beryl-types" }
beryl-proto = { path = "../beryl-proto" }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }

# RPC
tonic = { workspace = true, features = ["transport"] }
tonic-health = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging & Observability
tracing = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Utilities
clap = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Raft
openraft = { workspace = true, features = ["serde", "storage-v2"] }

# Storage
rocksdb = { workspace = true, default-features = false, features = ["snappy"] }
fs2 = { workspace = true }
bincode = { workspace = true }

# Snapshot checksums and file identities
sha2 = { workspace = true }

[[bin]]
name = "beryl-metadata"
path = "src/bin/main.rs"

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
